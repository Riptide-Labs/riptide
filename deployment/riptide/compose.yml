---
include:
  # A path list merges the two files like -f, so the self-monitoring file's grafana fragment applies.
  # To run without Prometheus and Pyroscope, add compose.override.no-self-monitoring.yml (#927).
  - path:
      - ../clickhouse/compose.yml
      - ../clickhouse/compose.self-monitoring.yml

services:
  riptide:
    image: ghcr.io/riptide-labs/riptide:latest
    depends_on:
      clickhouse:
        condition: service_healthy
      # started, not healthy: Pyroscope takes about a minute to report ready and the agent retries its
      # uploads, so waiting would delay the quickstart for a convenience.
      pyroscope:
        condition: service_started
        # Resolves when compose.override.no-self-monitoring.yml keeps Pyroscope from starting.
        required: false
    environment:
      TZ: UTC
      LOGGING_LEVEL_ROOT: WARN
      RIPTIDE_CLICKHOUSE_ENDPOINT: http://clickhouse:8123
      RIPTIDE_CLICKHOUSE_USERNAME: default
      # A SecretRef, so a password containing "://" or "#" is not parsed as scheme://value#key.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-riptide}
      RIPTIDE_CLICKHOUSE_PASSWORD: env://CLICKHOUSE_PASSWORD
      RIPTIDE_CLICKHOUSE_DATABASE: riptide
      # One multi receiver parses NetFlow v5/v9, IPFIX and sFlow on the published port
      RIPTIDE_RECEIVERS_FLOWS_TYPE: multi
      RIPTIDE_RECEIVERS_FLOWS_HOST: 0.0.0.0
      RIPTIDE_RECEIVERS_FLOWS_PORT: "9999"
      # Continuous profiling into the stack's Pyroscope (#921), on here as a quickstart convenience;
      # it is off by default everywhere else. collector matches the Prometheus target label, so the
      # three health dashboards name this riptide the same way.
      RIPTIDE_PROFILING_ENABLED: "true"
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      PYROSCOPE_APPLICATION_NAME: riptide
      PYROSCOPE_LABELS: collector=riptide
      JDK_JAVA_OPTIONS: --enable-native-access=ALL-UNNAMED
    ports:
      - "9999:9999/udp"
    healthcheck:
      # BusyBox wget is present in the temurin-alpine image; /readyz is 200 once receivers are listening
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

