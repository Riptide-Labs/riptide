#
# Scrapes riptide's /metrics and evaluates its alert rules (#908). The target
# list is a file of its own so a riptide running outside this stack is one file
# to swap, not a config edit; see the monitoring guide. No Alertmanager ships:
# alerts show here and in Grafana.
---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/riptide-alerts.yml

scrape_configs:
  - job_name: riptide
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
