#
# A riptide running on the host, outside this stack: from the IDE, the jar or a
# package. Selected with PROMETHEUS_TARGETS=./container-fs/prometheus/targets-host;
# compose.self-monitoring.yml maps host.docker.internal to the host gateway so
# this resolves on Linux as well as on Docker Desktop and OrbStack.
---
- targets:
    - host.docker.internal:8080
  labels:
    collector: riptide-on-host
