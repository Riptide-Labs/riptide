---
volumes:
  clickhouse-data:
    driver: local
  gf-data:
    driver: local

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      TZ: UTC
      CLICKHOUSE_USER: default
      CLICKHOUSE_DB: riptide
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
      - ./container-fs/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./container-fs/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping
      interval: 2s
      timeout: 1s
      retries: 20
    # SECURITY: Ports 8123 (HTTP) and 9000 (native) are published for development convenience
    # (e.g., running `clickhouse-client` from the host). The 'default' user is restricted to
    # localhost in users.xml, so external clients cannot authenticate. For production or
    # multi-tenant deployments, remove these port mappings and access ClickHouse only through
    # the internal compose network, or create properly scoped users with passwords and row
    # policies. See docs/deploy/multi-tenancy.md.
    ports:
      - "8123:8123/tcp"
      - "9000:9000/tcp"

  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      # ch-ui connects to ClickHouse from within the compose network, so localhost references
      # in VITE_CLICKHOUSE_URL are resolved by the browser (the host), not the container.
      # This works because the 'default' user accepts connections from 127.0.0.1/::1 and
      # ClickHouse ports are published. For production, use a scoped user with a password.
      VITE_CLICKHOUSE_URL: http://localhost:8123
      VITE_CLICKHOUSE_USER: default
      VITE_CLICKHOUSE_PASS: ""
    ports:
      - "5521:5521/tcp"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource,netsage-sankey-panel
      GF_FEATURE_TOGGLES_ENABLE: nestedFolders
    volumes:
      - gf-data:/var/lib/grafana
      - ./container-fs/grafana/provisioning:/etc/grafana/provisioning/
    healthcheck:
      test: curl --fail -s http://localhost:3000/healthz
      interval: 2s
      timeout: 1s
      retries: 20
    ports:
      - "3000:3000/tcp"
