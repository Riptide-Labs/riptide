---
volumes:
  clickhouse-data:
    driver: local
  gf-data:
    driver: local

services:
  clickhouse:
    # Pinned to the version the integration suite runs against (.github/e2e-images/
    # clickhouse.Dockerfile), so what an operator runs is what riptide is tested on.
    # Floating :latest drifted to 26.8, whose schema response client-v2 0.10.0 cannot
    # parse, and every test stayed green because no test starts this stack (#672).
    image: clickhouse/clickhouse-server:26.7@sha256:f90a77560f72b10802106ee49e9870e41668cbc496e280c3911f6e3b216657f3
    environment:
      TZ: UTC
      CLICKHOUSE_USER: default
      CLICKHOUSE_DB: riptide
      # Required, with no default: the default user holds access_management,
      # named_collection_control and show_named_collections_secrets. Compose refuses every
      # command on this file, before any container starts, while CLICKHOUSE_PASSWORD is unset or
      # empty. Set it in the environment or a .env file. Read by users.xml via from_env. See
      # docs/guides/docker-compose.md.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in a .env file next to compose.yml, see https://riptide.space/docs/guides/docker-compose}
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
      - ./container-fs/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./container-fs/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping
      interval: 2s
      timeout: 1s
      retries: 20
    # Loopback only: riptide and Grafana reach ClickHouse over the compose network, not through
    # these, so this costs the stack nothing and keeps a defaulted admin off the network (#651).
    # To reach ClickHouse from another host, override with `ports: !override` in a
    # compose.override.yml and set CLICKHOUSE_PASSWORD first.
    ports:
      - "127.0.0.1:8123:8123/tcp"
      - "127.0.0.1:9000:9000/tcp"

  grafana:
    # Pinned with ClickHouse below it: the provisioned datasource interpolates
    # ${CLICKHOUSE_PASSWORD} at Grafana's startup, so a floating tag can change that
    # behaviour with no code change here. Dependabot keeps both current (#672).
    image: docker.io/grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      TZ: UTC
      # Defaults to admin so the quickstart stays one command on a laptop. Set
      # GF_SECURITY_ADMIN_PASSWORD in the environment or an .env file for anything reachable
      # beyond localhost. See docs/guides/docker-compose.md.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Consumed by the provisioned ClickHouse datasource, which interpolates it at load.
      # Must match the ClickHouse password; no default to prevent mismatched credentials.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in a .env file next to compose.yml, see https://riptide.space/docs/guides/docker-compose}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource,netsage-sankey-panel
      GF_FEATURE_TOGGLES_ENABLE: nestedFolders
    volumes:
      - gf-data:/var/lib/grafana
      - ./container-fs/grafana/provisioning:/etc/grafana/provisioning/
    healthcheck:
      test: curl --fail -s http://localhost:3000/healthz
      interval: 2s
      timeout: 1s
      retries: 20
    ports:
      - "3000:3000/tcp"

  grafana-folders:
    # One-shot: nests the provisioned "Flow Analytics" folder under "Riptide" once Grafana is
    # up, then exits. The file provider cannot create a parent folder, and it keeps the folder
    # where it was moved because it addresses it by uid (#864). Idempotent, so every later
    # `up` finds nothing to do. Pinned by digest like the two images above.
    image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./container-fs/grafana/folders.sh:/folders.sh:ro
    entrypoint: ["sh", "/folders.sh"]
