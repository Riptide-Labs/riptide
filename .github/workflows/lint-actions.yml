# Enforces the workflow rules mechanically rather than by memory: actionlint
# for syntax and shell bugs (it is what caught the empty `tags-ignore:` and the
# `synchronize`-dropping `types:` filter), zizmor for the security posture
# (unpinned actions, over-broad permissions, credential persistence, template
# injection).
name: Lint Actions
run-name: Lint the GitHub Actions workflows
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
  # No `paths:` filter. `lint` is a required status check, and a required check
  # that is filtered out never reports — it does not pass, it stays pending, and
  # the PR can never merge. The job costs ten seconds; the filter cost merges.
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: lint-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release checksums
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "${url}" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      # zizmor's version is pinned in .github/requirements.txt, not in this
      # step's `env:`. Dependabot watches manifests, not `run:` steps, so a pin
      # kept here is a pin nothing updates — which is how this one came to name
      # a release zizmor's maintainers had withdrawn (#747). Any future
      # Python-packaged tool goes in that file for the same reason.
      #
      # `pip -r`, not `pipx install`, so the install is the thing Dependabot
      # edits and so a withdrawal is something this step can see at all: pip
      # reports the yank reason, pipx swallows it. The venv sidesteps PEP 668
      # rather than relying on the runner image's `break-system-packages`
      # default.
      #
      # Unlike actionlint above, zizmor gets no integrity check. A hash pin
      # means `--require-hashes` over the whole transitive closure, which is a
      # larger change with its own upkeep. The asymmetry is known and left as
      # is; do not read the two steps as equally protected.
      - name: Install zizmor
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          venv="${RUNNER_TEMP}/lint-tools"
          log="${RUNNER_TEMP}/zizmor-install.log"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --disable-pip-version-check \
            --requirement .github/requirements.txt 2>&1 | tee "${log}"
          # Refuse a withdrawn release, do not merely report it. pip installs a
          # yanked version whenever it is pinned exactly — which is what a pin
          # file always does — and still exits 0, so a withdrawal reaches nobody
          # unless a human happens to read the log. That is precisely how the
          # 1.27.0 pin survived (#747). The tradeoff is deliberate: a yank
          # upstream turns this job red until someone bumps the pin.
          if grep -q "yanked version" "${log}"; then
            echo "::error::.github/requirements.txt pins a release its maintainers withdrew; bump the pin." >&2
            grep -i "yank" "${log}" >&2
            exit 1
          fi
          # Compare, do not just print. An install that quietly produced some
          # other version would otherwise pass for the bump. The manifest is the
          # single source of truth for the version that belongs here.
          pinned="$(sed -n 's/^zizmor==//p' .github/requirements.txt)"
          : "${pinned:?no exact zizmor== pin found in .github/requirements.txt}"
          installed="$("${venv}/bin/zizmor" --version | awk '{print $2}')"
          if [ "${installed}" != "${pinned}" ]; then
            echo "::error::zizmor ${installed} installed, but .github/requirements.txt pins ${pinned}" >&2
            exit 1
          fi
          echo "zizmor ${installed} matches the pin in .github/requirements.txt"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
      - name: Lint workflows
        run: |
          make lint-actions
      # Not about workflows, but it belongs to the same "enforce it mechanically"
      # job and needs no extra permissions. The contributor badge count and the
      # credit table are literals in README.md, so they drift silently whenever
      # .all-contributorsrc is edited without re-running the generator.
      - name: Check the contributor list is in sync
        run: |
          make contributors-check
