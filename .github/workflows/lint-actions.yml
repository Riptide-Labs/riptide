# Enforces the workflow rules mechanically rather than by memory: actionlint
# for syntax and shell bugs (it is what caught the empty `tags-ignore:` and the
# `synchronize`-dropping `types:` filter), zizmor for the security posture
# (unpinned actions, over-broad permissions, credential persistence, template
# injection).
name: Lint Actions
run-name: Lint the GitHub Actions workflows
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
  # No `paths:` filter. `lint` is a required status check, and a required check
  # that is filtered out never reports — it does not pass, it stays pending, and
  # the PR can never merge. The job costs ten seconds; the filter cost merges.
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: lint-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release checksums
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "${url}" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      # zizmor's version is pinned in .github/requirements.txt, not in this
      # step's `env:`. Dependabot watches manifests, not `run:` steps, so a pin
      # kept here is a pin nothing updates — which is how this one came to name
      # a release zizmor's maintainers had withdrawn (#747). Any future
      # Python-packaged tool goes in that file for the same reason.
      #
      # `pip -r`, not `pipx install`, so the install is the thing Dependabot
      # edits and so a withdrawn pin is visible: pip prints the yank reason,
      # pipx swallows it. The venv sidesteps PEP 668 rather than relying on the
      # runner image's `break-system-packages` default.
      #
      # Unlike actionlint above, zizmor gets no integrity check. A hash pin
      # means `--require-hashes` over the whole transitive closure, which is a
      # larger change with its own upkeep. The asymmetry is known and left as
      # is; do not read the two steps as equally protected.
      - name: Install zizmor
        run: |
          python3 -m venv "${RUNNER_TEMP}/lint-tools"
          "${RUNNER_TEMP}/lint-tools/bin/pip" install --disable-pip-version-check \
            --requirement .github/requirements.txt
          # Print what actually got installed, so a stale or broken install
          # cannot pass for the pinned version in the log.
          "${RUNNER_TEMP}/lint-tools/bin/zizmor" --version
          echo "${RUNNER_TEMP}/lint-tools/bin" >> "${GITHUB_PATH}"
      - name: Lint workflows
        run: |
          make lint-actions
      # Not about workflows, but it belongs to the same "enforce it mechanically"
      # job and needs no extra permissions. The contributor badge count and the
      # credit table are literals in README.md, so they drift silently whenever
      # .all-contributorsrc is edited without re-running the generator.
      - name: Check the contributor list is in sync
        run: |
          make contributors-check
