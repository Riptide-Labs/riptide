name: Riptide Release
run-name: Release Workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# A half-published release is worse than a late one — never cancel in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write      # upload release assets
      packages: write      # push the container image to GHCR
      id-token: write      # keyless cosign signing via the workflow's OIDC identity
      attestations: write  # SLSA build provenance for the artifacts and the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the lineage check below needs origin/main and
          # the tag's merge base with it. fetch-depth: 0 selects the refspec
          # +refs/heads/*:refs/remotes/origin/*, which is what populates
          # origin/main on a tag event; the default shallow clone has neither.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25 for x64
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: maven
      # The tag push is what releases, and `make release` commits with `-am`, so
      # an operator with unrelated edits in the tree publishes them without
      # noticing. This catches that, and a release cut from a base that never
      # merged, and an unreviewed dependency added to pom.xml.
      #
      # It is not a defence against an author who controls the tag's contents:
      # this workflow file, the Makefile target and the script are all read from
      # the tagged commit, so a tag can delete or no-op the check. Tag and branch
      # protection is the control for that, not this step.
      #
      # Runs before every build, sign, publish and push step, so a refusal costs
      # nothing and leaks nothing. It sits after the JDK setup only because the
      # Makefile resolves java/javac/mvn at parse time on any target.
      - name: Verify the tag carries only code that went through main
        run: |
          make release-lineage LINEAGE_REF="${GITHUB_REF_NAME}"
      - name: Check if you accidentally want to release a SNAPSHOT version
        run: |
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${POM_VERSION}" == *"SNAPSHOT"* ]]; then
            echo "Error: Your pom has a SNAPSHOT release. Set the pom to a version number without SNAPSHOT."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${POM_VERSION}" ]]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not match pom version ${POM_VERSION}."
            echo "The image and the binaries would self-report a version nobody can find."
            exit 1
          fi
          echo "VERSION=${POM_VERSION}" >> "${GITHUB_ENV}"
      - name: Resolve image tags
        run: |
          # A prerelease (v1.2.0-rc1) gets its exact version tag and nothing
          # else: :latest and the floating :X.Y must keep pointing at the newest
          # *stable* release.
          image="ghcr.io/riptide-labs/riptide"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            {
              echo "PRERELEASE=true"
              echo "IMAGE_TAGS=${image}:${VERSION}"
            } >> "${GITHUB_ENV}"
          else
            {
              echo "PRERELEASE=false"
              echo "IMAGE_TAGS=${image}:${VERSION},${image}:${VERSION%.*},${image}:latest"
            } >> "${GITHUB_ENV}"
          fi
      - name: Set date and short git hash
        run: |
          {
            echo "SHORT_GIT_SHA=$(git rev-parse --short HEAD)"
            echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } >> "${GITHUB_ENV}"
      - name: Build with tests
        run: |
          make
      - name: Build DEB and RPM packages
        run: |
          make packages
      - name: Persist JAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riptide-jar
          path: |
            target/*.jar
      # SPDX over the source tree, so the SBOM describes what went into the
      # build rather than what syft can infer from the finished jar. The scan
      # is scoped and the POMs resolved by .syft.yaml — without it the report
      # is mostly undeclared licenses and unknown originators (#402).
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          config: .syft.yaml
          format: spdx-json
          artifact-name: riptide-${{ env.VERSION }}.spdx.json
          output-file: target/riptide-${{ env.VERSION }}.spdx.json
          # Both uploads happen inside this step, BEFORE the assertion below:
          # the artifact would persist the unasserted SBOM under the same name
          # as the release asset, and on a workflow re-run the action finds the
          # existing release and replaces the corrected asset with a raw one.
          # The release asset is attached later from target/, post-assertion.
          upload-artifact: false
          upload-release-assets: false
      # Facts syft cannot derive: our own license on the deb entry (a deb control
      # file has no license field) and on the document root (syft has no flag for
      # it). Asserted here — before the HTML render and the later signing — so the
      # machine-readable file, the report, and the signed asset agree. Fails the
      # release rather than shipping NOASSERTION if the SBOM shape drifts (#406).
      - name: Assert first-party license facts in the SBOM
        run: |
          make sbom-assert SBOM="target/riptide-${VERSION}.spdx.json"
      # The SPDX file is machine-readable and human-hostile; ship the human answer
      # beside it. One self-contained HTML file that works offline — verified to
      # contain no network fetches, only plain <a> links.
      - name: Render SBOM HTML report
        uses: no42-org/blitsbom@0ddd4fd19cc563e3e1c1e27f7be2ffc7225dca65 # v0.8.2
        with:
          sbom: target/riptide-${{ env.VERSION }}.spdx.json
          output: target/riptide-${{ env.VERSION }}-sbom-report.html
          # Digest-pinned for immutability: the action's default resolves a mutable
          # GHCR tag (report-X.Y.Z). This digest MUST move with the `uses:` pin above —
          # Dependabot bumps that SHA but cannot see this input, so on every action
          # bump re-resolve with:
          #   docker buildx imagetools inspect ghcr.io/no42-org/blitsbom:report-X.Y.Z
          image: ghcr.io/no42-org/blitsbom@sha256:ff58ce61841db40cd530fd231f999b9fcd413f4df506dca45c7bdf3404087a9f # report-0.6.1
      - name: Login to Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push container image
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DATE=${{ env.BUILD_DATE }}
            GIT_SHORT_HASH=${{ env.SHORT_GIT_SHA }}
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE_TAGS }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          # Sign the digest, not a tag: covers every tag pointing at this image.
          cosign sign --yes "ghcr.io/riptide-labs/riptide@${IMAGE_DIGEST}"
      - name: Sign release artifacts
        run: |
          # cosign 3.x writes the sigstore bundle (sig + cert + Rekor proof in one file);
          # the legacy --output-signature/--output-certificate pair no longer works alone.
          for artifact in target/*.jar target/*.deb target/*.rpm target/*.spdx.json target/*-sbom-report.html; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done
      # Provenance answers a different question than the cosign signature does:
      # not "did this come from us" but "which workflow, commit and inputs
      # produced it". Verify with `gh attestation verify`.
      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'target/*.jar, target/*.deb, target/*.rpm'
      - name: Attest build provenance for the container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/riptide-labs/riptide
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true
      # Draft first, publish after: this repo's releases are immutable, so assets can
      # only be attached BEFORE publication. The action already drafts stable releases
      # internally, but publishes prereleases first and uploads after — which an
      # immutable release rejects (v0.7.1-rc1 failed exactly there, with zero assets).
      # Drafting unconditionally gives both flavours the same, working order.
      - name: Release ${{ github.ref_name }}
        id: gh_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: |
            target/*.jar
            target/*.deb
            target/*.rpm
            target/*.spdx.json
            target/*-sbom-report.html
            target/*.sigstore.json
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
        run: |
          # Publication flips the release immutable; every asset is already attached.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false >/dev/null
          echo "published release ${RELEASE_ID} for ${GITHUB_REF_NAME}"
