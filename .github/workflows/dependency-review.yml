# Blocks a PR that would introduce a dependency with a known high-severity
# vulnerability. Dependabot's alerts find these too, but only once the
# dependency is already on main.
name: Dependency Review
run-name: Review dependency changes in this PR
on:
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-scanning:
    uses: ./.github/workflows/code-scanning-available.yml

  review:
    needs: code-scanning
    if: needs.code-scanning.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # post the summary comment when the review fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
