name: Docs
run-name: Build and deploy the documentation site
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    # release tags redeploy so the version resolved from the highest v* tag stays
    # current (path filters are not evaluated for tag pushes)
    tags: [ 'v*' ]
    paths: [ 'docs/**', 'landing/**', '.github/workflows/docs.yml', 'Makefile' ]
  pull_request:
    branches: [ 'main' ]
    paths: [ 'docs/**', 'landing/**', '.github/workflows/docs.yml', 'Makefile' ]

permissions:
  contents: read

# a release tag and a docs-touching main push can arrive together — serialize
# deployments to the single github-pages environment instead of failing one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tags needed so the docs build can resolve the latest release version
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build documentation
        run: |
          make docs
      # The Docusaurus site lives under /docs (baseUrl must match); the landing
      # page is served from the domain root. Its install commands carry
      # %%VERSION%% tokens substituted here from the highest v* tag — the same
      # source of truth docusaurus.config.ts uses for the docs. 404.html must
      # sit at the artifact root — GitHub Pages only serves it from there — and
      # keeps a redirector so pre-landing deep links (riptide.space/X and legacy
      # riptide-labs.github.io/riptide/X, which GitHub forwards path-preserving)
      # land on /docs/X instead of a dead end. Real 404s under /docs/ still
      # render the Docusaurus page.
      - name: Stage site under /docs with landing page
        run: |
          mkdir -p site/docs
          cp -R docs/build/. site/docs/
          cp -R landing/. site/
          # stable tags only: version sort ranks v0.7.1-rc3 above v0.7.1
          VERSION=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//')
          test -n "${VERSION}" || { echo "no v* tag found — cannot resolve %%VERSION%% for the landing page"; exit 1; }
          sed -i "s/%%VERSION%%/${VERSION}/g" site/index.html
          REDIRECT='<script>(function(){var p=location.pathname;if(p.indexOf("/docs")!==0){location.replace("/docs"+p+location.search+location.hash)}})()</script>'
          sed "s|<head>|<head>${REDIRECT}|" docs/build/404.html > site/404.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
