# Builds the flake and runs its checks on PRs that touch the Nix files or the
# pom. The pom trigger is the point: a Maven dependency change staled the
# `mvnHash` in nix/package.nix, and this job fails loudly on that PR instead of
# at some consumer's `nix build`.
name: Riptide Nix
run-name: Build the flake and run flake checks
on:
  workflow_dispatch:
  pull_request:
    branches: [ 'main' ]
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'pom.xml'
      - '.github/workflows/nix.yml'

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build the package
        id: build
        run: |
          set -o pipefail
          make nix 2>&1 | tee nix-build.log
      # A stale mvnHash after a pom change is the usual failure here. For same-repo PRs (including
      # Dependabot's, which cannot touch nix/package.nix themselves) the corrected hash is pushed
      # straight back to the PR branch; the push uses the NIX_MVNHASH_TOKEN fine-grained PAT because
      # a GITHUB_TOKEN push would not re-trigger the required checks. Fork PRs and runs without the
      # secret fall back to surfacing the expected hash in the job summary — see #324. The job still
      # fails either way: the tree it tested had the stale hash; the pushed commit gets a fresh run.
      #
      # Security: The push step uses a fresh isolated checkout to prevent token exfiltration. The
      # build step above executes PR-controlled code that could install git hooks or modify git
      # config in the workspace. A fresh checkout in a separate directory ensures no malicious hooks
      # or config can intercept the git operations that receive PUSH_TOKEN.
      - name: Fix or explain a hash mismatch
        if: failure() && steps.build.outcome == 'failure'
        env:
          PUSH_TOKEN: ${{ secrets.NIX_MVNHASH_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          got="$(grep -oE 'got:\s+sha256-[A-Za-z0-9+/=]+' nix-build.log | grep -oE 'sha256-[A-Za-z0-9+/=]+' | head -1 || true)"
          if [ -z "${got}" ]; then
            {
              echo "### Nix build failed"
              echo "No hash mismatch detected — check the build log above for the real cause."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [ "${SAME_REPO}" = "true" ] && [ -n "${PUSH_TOKEN}" ] && [ -n "${HEAD_REF}" ]; then
            # Create a fresh isolated checkout for git operations to prevent hook-based token theft.
            # The build workspace may contain malicious hooks or git config installed by PR code.
            isolated_dir="$(mktemp -d)"
            trap 'rm -rf "${isolated_dir}"' EXIT
            cd "${isolated_dir}"
            git clone --depth=1 --branch="${HEAD_REF}" \
              "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
            cd repo
            sed -i -E "s|mvnHash = \"sha256-[^\"]*\";|mvnHash = \"${got}\";|" nix/package.nix
            if git diff --quiet -- nix/package.nix; then
              echo "mvnHash on \`${HEAD_REF}\` is already \`${got}\`; this run tested a stale head." >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nix/package.nix
            git commit -m "build(nix): update mvnHash after pom change" \
              -m "Auto-committed by the nix workflow after a fixed-output hash mismatch."
            git push origin "HEAD:refs/heads/${HEAD_REF}"
            {
              echo "### Stale mvnHash fixed automatically"
              echo "Pushed the corrected hash (\`${got}\`) to \`${HEAD_REF}\`. The new commit re-runs all checks; this failed run is superseded."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          {
            echo "### Nix build failed"
            echo "The maven-deps hash in \`nix/package.nix\` is stale (a pom change moved it)."
            echo ""
            echo "Fix it with **\`make nix-hash\`**, or set \`mvnHash\` to:"
            echo ""
            echo "\`\`\`"
            echo "${got}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
      - name: Run flake checks
        run: |
          make nix-check
