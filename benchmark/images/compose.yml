# The benchmark lab's container images. Not a runnable stack: OpenTofu reads
# the image of each service (benchmark/lab/main.tf), and Dependabot's
# docker-compose ecosystem keeps the tags and digests current. ClickHouse is
# not here: the lab reads it from deployment/clickhouse/compose.yml, so the
# SUT's dependency matches what operators run.
#
# grafana: grafana/grafana, not grafana/grafana-oss, which stopped publishing
# at 13.0.2. The distroless image has no shell, curl or /run.sh; the lab needs
# none of them (built-in datasources only, readiness checked from the VM).
services:
  grafana:
    image: docker.io/grafana/grafana:13.3.0-distroless-slim@sha256:5cdd2ce488651f2ee77cac254a4d58b7009b42b68378102241c25caca7d21944
  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
  pyroscope:
    image: docker.io/grafana/pyroscope:2.4.2@sha256:ef9b48976386aa2781e84664dfdba7cc33a1b6793c0cc9d130812173a926ca1f
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
  nl6:
    image: ghcr.io/labmonkeys-space/nl6:v0.40.1@sha256:99d12e4fd3dee7e36942519ce8c59d274cf22933bb5b9eebab5a4e046de91296
