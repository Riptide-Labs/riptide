spring.main.banner-mode=off
spring.main.web-application-type=none
spring.main.keep-alive=true
# Pre-emptive: nothing in the daemon uses Spring's task infrastructure today (no @Async, @Scheduled,
# TaskExecutor or TaskScheduler), and with web-application-type=none there is no servlet container
# either, so this currently changes nothing. It matters the moment one is added — Spring then hands
# out an unbounded SimpleAsyncTaskExecutor and every spring.task.*.pool.* knob goes silently inert,
# so the two simple-executor ceilings below are set now rather than after something overruns.
# The collector's own hot paths (Netty loops, the batch flusher, config reload, GeoIP) build their
# own factories and are untouched by this.
spring.threads.virtual.enabled=true
spring.task.execution.simple.concurrency-limit=16
spring.task.scheduling.simple.concurrency-limit=4

spring.config.import=optional:file:/etc/riptide/config.yaml

# DAEMON
# Receivers are empty by default: the daemon starts no listeners. Note that
# entries defined here merge with (and cannot be removed by) external config.
# RECEIVER EXAMPLE
#riptide.receivers.ipfix.type=ipfix
#riptide.receivers.ipfix.host=0.0.0.0
#riptide.receivers.ipfix.port=4739

# CLASSIFICATION EXAMPLE
#riptide.classification.rules=file:/etc/riptide/classification-rules.csv
# Poll the rules resource (a file or an http(s) endpoint) and apply changes without a
# restart; absent or 0 disables it and the rules are parsed once at boot.
#riptide.classification.reload-interval=5m

# CLICKHOUSE
# username/password are SecretRefs: a bare literal binds via the plain fallback, a scheme://
# reference (env://, file://, vault://, sops://) is resolved from a secret store at startup.
# Leave password unset for the default user's empty password (a blank value is not a valid ref).
riptide.clickhouse.endpoint=http://localhost:8123
riptide.clickhouse.username=default
#riptide.clickhouse.password=vault://secret/riptide/clickhouse#password
riptide.clickhouse.database=riptide
# Client-side insert batching: flows are buffered and inserted as one insert per batch, flushed
# at max-rows rows or after max-latency, whichever comes first (per-flow-record inserts collapse
# throughput — each insert forms a part and fires the four rollup views). A full queue drops
# flows (counted + logged) instead of blocking the parsers; a failed insert costs the whole
# batch and surfaces as a flusher ERROR log line (alert on it — metrics are not exported yet),
# never as an error on the ingest path. Budget the service manager's stop timeout (systemd
# TimeoutStopSec) as (5s x total parsers) + shutdown-grace-period + 2s for the management
# server + 2s more if the MCP SSE transport is enabled: each parser awaits its dispatch
# executor for up to 5s, a 'multi' receiver has one parser per protocol, and each HTTP
# server spends up to its own 2s budget letting in-flight exchanges finish.
#riptide.clickhouse.batch.enabled=true
#riptide.clickhouse.batch.max-rows=10000
#riptide.clickhouse.batch.max-latency=2s
#riptide.clickhouse.batch.queue-capacity=40000
#riptide.clickhouse.batch.shutdown-grace-period=5s
# Server-side insert coalescing. Unset it derives (it is NOT a fixed false): off while batching
# is enabled (superseded by batching, which keeps insert errors visible); with batching disabled
# it follows manage-schema — on in manage mode, off in provisioned mode. Set it to pin a value.
#riptide.clickhouse.async-inserts=

# SNMP INTERFACE POLLING
# Interface tables are walked on a schedule, not on demand: an exporter is registered when its
# first flow arrives, and enrichment reads the resulting snapshot without ever issuing SNMP.
# Between an exporter's first flow and its first completed walk, flows carry no SNMP-derived
# interface fields — static pins and exporter-pushed option data still apply. That warmup window
# is expected, not a fault.
#
# Per-agent cadence lives in named polling profiles (riptide.snmp.polling.<name>) referenced
# from agent ranges in the inventory file; the retired global keys
# riptide.snmp.poll.refresh-interval-ms / snapshot-expiry-ms fail startup if set.
# refresh-interval is how fresh the data is kept. snapshot-expiry is a separate, longer
# backstop bounding staleness across ifIndex reassignment after a reboot (RFC 2863): a snapshot
# past the refresh interval but inside the expiry window is still served, because an interface
# name from the previous cycle beats none.
#riptide.snmp.polling.default.refresh-interval=10m
#riptide.snmp.polling.default.snapshot-expiry=30m
# Ceiling on walks in flight across the whole fleet; per-endpoint concurrency is always 1.
#riptide.snmp.poll.pool-width=4
# Refresh intervals of silence after which an exporter stops being polled.
#riptide.snmp.poll.deregister-after=3
# Unreachable endpoints back off exponentially between these two, rather than retrying at a
# fixed interval — a walk against a dead agent holds a pool slot for its whole timeout.
#riptide.snmp.poll.dead-endpoint-base-ms=60000
#riptide.snmp.poll.dead-endpoint-ceiling-ms=1800000
# Bound on retained snapshots, counted in exporters: registration follows flow arrival, so the
# population is whatever sends flows, including a spoofed source.
#riptide.snmp.poll.max-exporters=4096

# SNMP OPTION TABLE
# Retention for exporter-pushed interface option records (v9/IPFIX). This no longer controls SNMP
# freshness — see riptide.snmp.polling.default.refresh-interval above. Left commented so that setting it
# is a deliberate act: the collector warns when it is set, because it used to mean something else.
#riptide.snmp.cache.retention-ms=600000

# AGENT AND EXPORTER EXAMPLE
# riptide.nodes was removed in 0.9. Agent ranges and exporter enrichment entries live
# in the inventory file; only the named credential sets and polling profiles they
# reference live here. Run `riptide convert <old-config>` to migrate a 0.8 file.
# Secret references are resolved at poll time — never put plaintext secrets here:
#   env://NAME                                          environment variable
#   file:///run/secrets/community                       file content (trimmed)
#   file:///etc/riptide/sec.properties#snmp.community   key in a properties file
#   vault://secret/snmp/core-router#community           HashiCorp Vault KV v2 (<mount>/<path>#<key>)
#   sops:///etc/riptide/secrets.yaml#snmp.community     SOPS-encrypted YAML/JSON (decrypted via the sops binary)
#riptide.inventory.file=/etc/riptide/inventory.yaml
#riptide.snmp.credentials.core-v2c.version=v2c
#riptide.snmp.credentials.core-v2c.community=env://RIPTIDE_SNMP_COMMUNITY
#riptide.snmp.credentials.corp-v3.version=v3
#riptide.snmp.credentials.corp-v3.security-name=monitoring
# Optionally restrict file:// access:
#riptide.secrets.allowed-paths=/run/secrets,/etc/riptide
# Vault (enables the vault:// resolver; token e.g. from a Vault Agent sink):
#riptide.secrets.vault.uri=https://vault.example.com:8200
#riptide.secrets.vault.token=${VAULT_TOKEN}
# SOPS (age key for decryption; command defaults to `sops` on the PATH):
#riptide.secrets.sops.command=sops
#riptide.secrets.sops.age-key-file=/etc/riptide/age.key

# ENRICHER: HOSTNAMES
riptide.enricher.hostnames.enabled=false

# MCP SERVER
# Embedded Model Context Protocol server for AI agent clients. Off by default. The sse transport
# binds loopback and speaks unauthenticated JSON-RPC unless auth is enabled: set both bind-address
# and auth.enabled deliberately before exposing it. In a provisioned (multi-tenant) deployment,
# point mcp.clickhouse at the tenant reader (bi_<tenant>@<database>) — it already holds SELECT on flows and
# every rollup, so the ingest writer keeps its insert-only grants. Unset it reuses
# riptide.clickhouse.* , which is correct only in single-tenant manage mode.
#riptide.mcp.enabled=true
#riptide.mcp.transport=stdio
#riptide.mcp.sse-port=8081
#riptide.mcp.bind-address=127.0.0.1
#riptide.mcp.max-sse-sessions=64
#riptide.mcp.clickhouse.username=bi_acme@riptide
#riptide.mcp.clickhouse.password=vault://secret/riptide/clickhouse#bi_acme
#riptide.mcp.auth.enabled=true
#riptide.mcp.auth.tokens[0]=file:///etc/riptide/mcp-token

# MANAGEMENT
# Plain-HTTP health endpoints for Kubernetes probes / Docker Compose healthchecks:
#   GET /livez  — process liveness (receiver event loops alive); never touches ClickHouse
#   GET /readyz — readiness (all receivers bound and listening); excludes ClickHouse by design
riptide.management.enabled=true
riptide.management.port=8080
riptide.management.bind-address=0.0.0.0
